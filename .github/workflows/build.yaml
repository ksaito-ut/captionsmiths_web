jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure git credentials for GitHub Packages
        run: |
          git config --global url."https://${{ secrets.REMOTE_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        continue-on-error: true