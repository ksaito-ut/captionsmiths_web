    text: |
      ### Method
      <img
        src="public/method.png"
        class="uk-align-center uk-responsive-width"
        alt=""
      />
      Overview during training (left) and inference (right). <b> Left: </b> We compute conditioning values for each caption in Condition Calculator. The conditions are converted into token embeddings via Condition Encoding. Then, the learnable parameters are trained to control the language pattern in the output caption. <b> Right : </b>  In inference, users can either manually specify the conditioning scalars or employ an example language pattern as a sentence. 
